<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Files & Folder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i data-lucide="folder-kanban" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold text-white tracking-tight flex items-center gap-2">
          <span>Shared Web Drive</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-semibold border border-emerald-500/30">Live Direct</span>
        </h1>
        <p class="text-xs text-slate-400">Stream & download files directly from host</p>
      </div>
    </div>

    <!-- Search & View Toggle -->
    <div class="flex items-center gap-3">
      <div class="relative hidden sm:block">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Search files in folder..."
          oninput="filterFiles()"
          class="bg-slate-800/80 border border-slate-700 text-xs text-white rounded-xl pl-9 pr-3 py-2 w-56 focus:outline-none focus:border-indigo-500"
        />
      </div>

      <div class="flex items-center bg-slate-800 rounded-xl p-1 border border-slate-700">
        <button id="btnGrid" onclick="setViewMode('grid')" class="p-1.5 rounded-lg bg-indigo-600 text-white transition-all" title="Grid View">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
        </button>
        <button id="btnList" onclick="setViewMode('list')" class="p-1.5 rounded-lg text-slate-400 hover:text-white transition-all" title="List View">
          <i data-lucide="list" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-6">
    <!-- Breadcrumb Path Bar -->
    <div class="flex items-center justify-between flex-wrap gap-3 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4">
      <nav id="breadcrumbs" class="flex items-center gap-1.5 text-xs sm:text-sm font-medium overflow-x-auto text-slate-300">
        <!-- Breadcrumbs injected dynamically -->
      </nav>

      <div class="flex items-center gap-2 text-xs text-slate-400">
        <span id="itemCount">Loading files...</span>
        <button onclick="downloadCurrentFolderZip()" class="px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600 border border-indigo-500/30 text-indigo-300 hover:text-white rounded-xl font-semibold flex items-center gap-1.5 transition-all">
          <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i>
          <span>Download All (ZIP)</span>
        </button>
      </div>
    </div>

    <!-- Mobile Search Bar -->
    <div class="block sm:hidden">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input
          type="text"
          id="mobileSearchInput"
          placeholder="Search files..."
          oninput="document.getElementById('searchInput').value = this.value; filterFiles();"
          class="w-full bg-slate-900 border border-slate-800 text-xs text-white rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-indigo-500"
        />
      </div>
    </div>

    <!-- Loading State -->
    <div id="loader" class="py-20 text-center space-y-3">
      <div class="w-8 h-8 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="text-xs text-slate-400">Loading files from host laptop...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-20 text-center space-y-3 bg-slate-900/30 rounded-3xl border border-slate-800/60">
      <i data-lucide="folder-open" class="w-12 h-12 text-slate-600 mx-auto"></i>
      <h3 class="text-sm font-bold text-slate-300">Folder is Empty</h3>
      <p class="text-xs text-slate-500">No files found in this directory</p>
    </div>

    <!-- Files Container (Grid / List) -->
    <div id="fileContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4"></div>
  </main>

  <!-- Preview Modal (Images, Video, Audio, PDF, Text) -->
  <div id="previewModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
        <div class="flex items-center gap-2.5 min-w-0">
          <i id="previewIcon" data-lucide="file" class="w-5 h-5 text-indigo-400 flex-shrink-0"></i>
          <span id="previewTitle" class="font-bold text-sm text-white truncate max-w-md">Preview</span>
        </div>
        <div class="flex items-center gap-2">
          <a id="previewDownloadBtn" href="#" download class="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1.5 transition-all">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Download</span>
          </a>
          <button onclick="closePreview()" class="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Modal Body -->
      <div id="previewBody" class="flex-1 p-4 overflow-auto flex items-center justify-center min-h-[350px] bg-slate-950/80">
        <!-- Injected dynamic preview content -->
      </div>
    </div>
  </div>

  <footer class="border-t border-slate-850 py-4 text-center text-xs text-slate-500">
    Shared directly via <span class="text-indigo-400 font-semibold">One-Click Cloudflare Tunnel</span> • Secure End-to-End
  </footer>

  <script>
    let currentPath = '';
    let allItems = [];
    let viewMode = 'grid';

    async function loadDirectory(path = '') {
      currentPath = path;
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('fileContainer').innerHTML = '';

      try {
        const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
        if (!res.ok) throw new Error('Failed to load folder');
        const data = await res.json();

        allItems = data.items || [];
        renderBreadcrumbs(data.currentPath || path);
        renderFiles(allItems);
      } catch (err) {
        console.error('Error loading directory:', err);
        document.getElementById('fileContainer').innerHTML = `
          <div class="col-span-full text-center py-16 text-red-400 text-xs">
            <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2 text-red-500"></i>
            Failed to load folder contents: ${err.message}
          </div>
        `;
        lucide.createIcons();
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    function renderBreadcrumbs(path) {
      const nav = document.getElementById('breadcrumbs');
      const parts = path.split('/').filter(Boolean);

      let html = `
        <button onclick="loadDirectory('')" class="hover:text-indigo-400 flex items-center gap-1 font-bold text-white">
          <i data-lucide="home" class="w-3.5 h-3.5"></i>
          <span>Root</span>
        </button>
      `;

      let accum = '';
      parts.forEach((part, idx) => {
        accum += (accum ? '/' : '') + part;
        const target = accum;
        const isLast = idx === parts.length - 1;
        html += `
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-600"></i>
          <button onclick="loadDirectory('${target}')" class="${isLast ? 'text-indigo-400 font-bold' : 'hover:text-white'} truncate max-w-[120px]">
            ${part}
          </button>
        `;
      });

      nav.innerHTML = html;
      lucide.createIcons();
    }

    function renderFiles(items) {
      const container = document.getElementById('fileContainer');
      const empty = document.getElementById('emptyState');
      const countEl = document.getElementById('itemCount');

      countEl.textContent = `${items.length} ${items.length === 1 ? 'item' : 'items'}`;

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      if (viewMode === 'grid') {
        container.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4';
        container.innerHTML = items.map(item => getGridCardHtml(item)).join('');
      } else {
        container.className = 'flex flex-col space-y-2';
        container.innerHTML = items.map(item => getListRowHtml(item)).join('');
      }

      lucide.createIcons();
    }

    function getFileIconName(item) {
      if (item.isDirectory) return 'folder';
      const ext = item.name.split('.').pop().toLowerCase();
      if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'].includes(ext)) return 'image';
      if (['mp4', 'mkv', 'webm', 'mov', 'avi'].includes(ext)) return 'film';
      if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(ext)) return 'music';
      if (['pdf'].includes(ext)) return 'file-text';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'archive';
      if (['js', 'ts', 'jsx', 'tsx', 'py', 'json', 'html', 'css', 'go', 'java', 'c', 'cpp'].includes(ext)) return 'code';
      if (['doc', 'docx', 'txt', 'md'].includes(ext)) return 'file-type';
      return 'file';
    }

    function getGridCardHtml(item) {
      const icon = getFileIconName(item);
      const isImg = ['image'].includes(icon);
      const fileUrl = `/raw?path=${encodeURIComponent(item.relativePath)}`;

      return `
        <div
          onclick="${item.isDirectory ? `loadDirectory('${item.relativePath}')` : `openPreview('${item.name}', '${item.relativePath}', '${icon}', '${formatBytes(item.size)}')`}"
          class="group relative bg-slate-900/70 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-3 sm:p-4 transition-all cursor-pointer flex flex-col justify-between hover:shadow-xl hover:shadow-indigo-500/10 hover:-translate-y-0.5"
        >
          <div class="aspect-square rounded-xl bg-slate-950/60 border border-slate-850 flex items-center justify-center overflow-hidden mb-3 group-hover:scale-102 transition-transform">
            ${isImg
              ? `<img src="${fileUrl}" loading="lazy" class="w-full h-full object-cover" alt="${item.name}" />`
              : `<i data-lucide="${icon}" class="w-10 h-10 ${item.isDirectory ? 'text-amber-400 fill-amber-400/20' : 'text-indigo-400'}"></i>`
            }
          </div>

          <div class="space-y-1 min-w-0">
            <h4 class="font-bold text-xs sm:text-sm text-slate-200 truncate group-hover:text-indigo-300" title="${item.name}">
              ${item.name}
            </h4>
            <p class="text-[11px] text-slate-500 font-medium">
              ${item.isDirectory ? `${item.childCount || 0} items` : formatBytes(item.size)}
            </p>
          </div>

          ${!item.isDirectory ? `
            <a
              href="/download?path=${encodeURIComponent(item.relativePath)}"
              onclick="event.stopPropagation()"
              download
              class="absolute top-2 right-2 p-1.5 rounded-lg bg-slate-800/80 hover:bg-indigo-600 text-slate-400 hover:text-white opacity-0 group-hover:opacity-100 transition-opacity"
              title="Download file"
            >
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
            </a>
          ` : ''}
        </div>
      `;
    }

    function getListRowHtml(item) {
      const icon = getFileIconName(item);
      return `
        <div
          onclick="${item.isDirectory ? `loadDirectory('${item.relativePath}')` : `openPreview('${item.name}', '${item.relativePath}', '${icon}', '${formatBytes(item.size)}')`}"
          class="group bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 rounded-xl p-3 flex items-center justify-between gap-4 transition-all cursor-pointer"
        >
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <i data-lucide="${icon}" class="w-5 h-5 ${item.isDirectory ? 'text-amber-400 fill-amber-400/20' : 'text-indigo-400'} flex-shrink-0"></i>
            <span class="text-xs sm:text-sm font-semibold text-slate-200 truncate group-hover:text-indigo-300" title="${item.name}">
              ${item.name}
            </span>
          </div>

          <div class="flex items-center gap-4 text-xs text-slate-400 flex-shrink-0">
            <span>${item.isDirectory ? 'Folder' : formatBytes(item.size)}</span>
            <span class="hidden md:inline">${new Date(item.mtime).toLocaleDateString()}</span>
            ${!item.isDirectory ? `
              <a
                href="/download?path=${encodeURIComponent(item.relativePath)}"
                onclick="event.stopPropagation()"
                download
                class="p-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white transition-colors"
                title="Download"
              >
                <i data-lucide="download" class="w-4 h-4"></i>
              </a>
            ` : `
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
            `}
          </div>
        </div>
      `;
    }

    function filterFiles() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderFiles(allItems);
        return;
      }
      const filtered = allItems.filter(item => item.name.toLowerCase().includes(q));
      renderFiles(filtered);
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btnGrid').className = mode === 'grid' ? 'p-1.5 rounded-lg bg-indigo-600 text-white' : 'p-1.5 rounded-lg text-slate-400 hover:text-white';
      document.getElementById('btnList').className = mode === 'list' ? 'p-1.5 rounded-lg bg-indigo-600 text-white' : 'p-1.5 rounded-lg text-slate-400 hover:text-white';
      renderFiles(allItems);
    }

    function openPreview(name, relPath, icon, sizeStr) {
      const modal = document.getElementById('previewModal');
      const title = document.getElementById('previewTitle');
      const body = document.getElementById('previewBody');
      const downloadBtn = document.getElementById('previewDownloadBtn');
      const iconEl = document.getElementById('previewIcon');

      title.textContent = `${name} (${sizeStr})`;
      downloadBtn.href = `/download?path=${encodeURIComponent(relPath)}`;
      iconEl.setAttribute('data-lucide', icon);

      const fileUrl = `/raw?path=${encodeURIComponent(relPath)}`;
      const ext = name.split('.').pop().toLowerCase();

      if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'].includes(ext)) {
        body.innerHTML = `<img src="${fileUrl}" class="max-w-full max-h-[70vh] object-contain rounded-xl shadow-lg" />`;
      } else if (['mp4', 'webm', 'mov'].includes(ext)) {
        body.innerHTML = `<video src="${fileUrl}" controls autoplay class="max-w-full max-h-[70vh] rounded-xl shadow-lg"></video>`;
      } else if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) {
        body.innerHTML = `
          <div class="text-center space-y-4 p-8">
            <i data-lucide="music" class="w-16 h-16 text-indigo-400 mx-auto animate-pulse"></i>
            <p class="font-bold text-sm text-white">${name}</p>
            <audio src="${fileUrl}" controls autoplay class="w-full max-w-md mx-auto"></audio>
          </div>
        `;
      } else if (['pdf'].includes(ext)) {
        body.innerHTML = `<iframe src="${fileUrl}" class="w-full h-[70vh] rounded-xl border border-slate-800"></iframe>`;
      } else if (['txt', 'md', 'json', 'js', 'ts', 'html', 'css', 'py', 'log'].includes(ext)) {
        fetch(fileUrl).then(r => r.text()).then(txt => {
          body.innerHTML = `<pre class="w-full h-[70vh] p-4 text-xs font-mono bg-slate-900 text-slate-200 overflow-auto rounded-xl border border-slate-800">${escapeHtml(txt)}</pre>`;
        }).catch(() => {
          body.innerHTML = `<p class="text-xs text-red-400">Failed to load text content</p>`;
        });
      } else {
        body.innerHTML = `
          <div class="text-center space-y-3 p-8">
            <i data-lucide="file" class="w-16 h-16 text-slate-600 mx-auto"></i>
            <p class="text-sm font-bold text-slate-300">Preview not available for this file type</p>
            <a href="${fileUrl}" download class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30">
              <i data-lucide="download" class="w-4 h-4"></i> Download File (${sizeStr})
            </a>
          </div>
        `;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closePreview() {
      const modal = document.getElementById('previewModal');
      const body = document.getElementById('previewBody');
      body.innerHTML = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function downloadCurrentFolderZip() {
      window.location.href = `/download-zip?path=${encodeURIComponent(currentPath)}`;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const dm = 1;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDirectory('');
    });
  </script>
</body>
</html>
